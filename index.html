<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1012" />
    <title>Motiv</title>
    <script>
      // Thème appliqué avant le premier rendu (sinon flash). Même clé, même défaut (sombre) et mêmes couleurs que src/design/theme.ts.
      try {
        var t = localStorage.getItem('motiv.theme.v1')
        t = t === 'light' || t === 'auto' ? t : 'dark'
      } catch (e) {
        t = 'dark'
      }
      document.documentElement.dataset.theme = t
      try {
        var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0f1012' : '#f4f3ef')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
