<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motiv</title>
    <script>
      // Thème appliqué avant le premier rendu (sinon flash). Même clé que src/ui/theme.ts.
      try {
        var t = localStorage.getItem('motiv.theme.v1')
        document.documentElement.dataset.theme = t === 'dark' || t === 'auto' ? t : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
